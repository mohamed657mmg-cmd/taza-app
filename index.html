<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>طازة - خضار وفاكهة</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #f4f6f3;
      color: #2b3b2e;
      padding-bottom: 75px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      min-height: 100vh;
      position: relative;
    }

    /* نظام الشاشات المباشر */
    .screen {
      display: none;
      padding: 16px;
    }

    .screen.active {
      display: block !important;
    }

    /* 1. شاشة البداية */
    #screen-splash.active {
      display: flex !important;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      background: linear-gradient(160deg, #134e26, #208341);
      color: #ffffff;
      text-align: center;
      padding: 40px 20px;
    }

    .splash-title {
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .splash-sub {
      font-size: 15px;
      opacity: 0.9;
    }

    .splash-art {
      font-size: 75px;
      margin: 40px 0;
    }

    .btn-main {
      width: 100%;
      background: #2ecc71;
      color: #ffffff;
      border: 0;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      display: block;
      margin-bottom: 12px;
    }

    .btn-skip {
      background: transparent;
      color: #ffffff;
      border: 0;
      font-size: 15px;
      cursor: pointer;
      padding: 10px;
    }

    /* 2. الصفحة الرئيسية */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header-logo {
      font-size: 22px;
      font-weight: 900;
      color: #1e7039;
    }

    .header-loc {
      font-size: 12px;
      color: #6d7d70;
      background: #f0f7ef;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .search-input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #e2eae1;
      background: #f8faf7;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .banner {
      background: linear-gradient(130deg, #1b6333, #2ea454);
      color: white;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .banner h3 { font-size: 17px; margin-bottom: 5px; }
    .banner p { font-size: 12px; opacity: 0.9; margin-bottom: 10px; }
    .banner button {
      background: white;
      color: #1b6333;
      border: 0;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .cat-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 20px;
      padding-bottom: 5px;
    }

    .cat-btn {
      background: #eef6ed;
      color: #1e7039;
      border: 0;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .products-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .prod-card {
      border: 1px solid #e7eee6;
      border-radius: 14px;
      padding: 12px;
      background: #ffffff;
      text-align: center;
    }

    .prod-img {
      font-size: 45px;
      background: #f6faf5;
      border-radius: 10px;
      padding: 15px 0;
      margin-bottom: 10px;
    }

    .prod-name { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
    .prod-unit { font-size: 11px; color: #839486; }
    .prod-price { font-size: 14px; color: #1e7039; font-weight: bold; margin: 8px 0; }

    .btn-add {
      width: 100%;
      background: #eaf6ea;
      color: #1e7039;
      border: 0;
      padding: 9px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 3. شريط التنقل السفلي */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 65px;
      background: #ffffff;
      border-top: 1px solid #e5ebe4;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 999;
    }

    .nav-btn {
      background: transparent;
      border: 0;
      color: #819284;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
    }

    .nav-btn span { font-size: 20px; }
    .nav-btn.active { color: #1e7039; font-weight: bold; }

    .badge {
      position: absolute;
      top: -2px;
      left: 8px;
      background: #e74c3c;
      color: white;
      font-size: 10px;
      border-radius: 50%;
      padding: 2px 6px;
    }

    /* 4. السلة وإتمام الطلب */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #edf2ec;
    }

    .counter-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #ccd8ca;
      background: #ffffff;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 900;
      padding: 20px 0;
      border-top: 2px dashed #e2eae1;
      margin-top: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 15px 0;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce5da;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 1. شاشة البداية -->
    <div id="screen-splash" class="screen active">
      <div>
        <div class="splash-title">🌿 طازة</div>
        <p class="splash-sub">خضار وفاكهة طازة لحد باب بيتك</p>
      </div>

      <div class="splash-art">🧺🥦🍅🍎</div>

      <div>
        <button type="button" class="btn-main" onclick="openHome()">ابدأ الآن</button>
        <button type="button" class="btn-skip" onclick="openHome()">تخطي ←</button>
      </div>
    </div>

    <!-- 2. الصفحة الرئيسية -->
    <div id="screen-home" class="screen">
      <div class="header-bar">
        <div class="header-logo">🌿 طازة</div>
        <div class="header-loc">📍 القاهرة - مدينة نصر</div>
      </div>

      <input type="text" id="searchInput" class="search-input" placeholder="بتدور على إيه؟" oninput="searchProducts()">

      <div class="banner">
        <div>
          <h3>طازة كل يوم 🌱</h3>
          <p>أعلى جودة من المزارع مباشرة</p>
          <button type="button" onclick="filterBy('الكل')">تسوق الآن</button>
        </div>
        <div style="font-size: 40px;">🍊🍓</div>
      </div>

      <div class="cat-scroll">
        <button type="button" class="cat-btn" onclick="filterBy('الكل')">🌿 الكل</button>
        <button type="button" class="cat-btn" onclick="filterBy('خضار')">🥦 خضار</button>
        <button type="button" class="cat-btn" onclick="filterBy('فاكهة')">🍎 فاكهة</button>
        <button type="button" class="cat-btn" onclick="filterBy('عروض')">🔥 عروض اليوم</button>
      </div>

      <h3 style="font-size: 16px; margin-bottom: 12px;">أحدث المنتجات</h3>
      <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- 3. شاشة السلة -->
    <div id="screen-cart" class="screen">
      <h2 style="margin-bottom: 15px;">🛒 سلة المشتريات</h2>
      <div id="cartItemsList"></div>

      <div class="total-box">
        <span>الإجمالي النهائي:</span>
        <span id="cartTotal">0 ج.م</span>
      </div>

      <button type="button" class="btn-main" onclick="showScreen('screen-checkout')">إتمام الطلب</button>
    </div>

    <!-- 4. شاشة إتمام الطلب والواتساب -->
    <div id="screen-checkout" class="screen">
      <h2 style="margin-bottom: 15px;">📋 بيانات التوصيل</h2>
      <div class="form-group">
        <input type="text" id="custName" placeholder="الاسم ثلاثي">
        <input type="tel" id="custPhone" placeholder="رقم الهاتف للتواصل">
        <textarea id="custAddress" rows="3" placeholder="العنوان بالتفصيل (الشارع، رقم العمارة، الشقة)"></textarea>
      </div>

      <button type="button" class="btn-main" style="background:#25D366;" onclick="sendWhatsApp()">💬 تأكيد وإرسال عبر واتساب</button>
      <button type="button" class="btn-skip" style="color:#555;" onclick="showScreen('screen-cart')">رجوع للسلة</button>
    </div>

    <!-- 5. شاشة الحساب والتتبع -->
    <div id="screen-orders" class="screen">
      <h2>📦 تتبع طلبك</h2>
      <div style="background:#f4f8f3; padding:15px; border-radius:12px; margin: 15px 0;">
        <b>حالة آخر طلب:</b>
        <p style="color:#1e7039; font-weight:bold; margin-top:5px;">🟢 طلبك مسجل وجاري تجهيزه</p>
      </div>
      <p style="font-size:13px; color:#777;">سيقوم المندوب بالتواصل معك قبل التوصيل مباشرة.</p>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="nav-bar" id="mainNavBar" style="display: none;">
      <button type="button" class="nav-btn active" onclick="navTo('screen-home', this)">
        <span>🏠</span>الرئيسية
      </button>
      <button type="button" class="nav-btn" onclick="navTo('screen-cart', this)">
        <span>🛒</span>السلة
        <b class="badge" id="cartBadge">0</b>
      </button>
      <button type="button" class="nav-btn" onclick="navTo('screen-orders', this)">
        <span>📦</span>الطلبات
      </button>
    </nav>

  </div>

  <script>
    // رقم الواتساب الخاص بك
    const WHATSAPP_NUM = "201000000000";

    const allProducts = [
      { id: 1, name: "طماطم بلدي", emoji: "🍅", price: 15, unit: "كيلو", cat: "خضار" },
      { id: 2, name: "خيار بلدي", emoji: "🥒", price: 18, unit: "كيلو", cat: "خضار" },
      { id: 3, name: "بطاطس تحمير", emoji: "🥔", price: 20, unit: "كيلو", cat: "خضار" },
      { id: 4, name: "بصل أحمر", emoji: "🧅", price: 16, unit: "كيلو", cat: "خضار" },
      { id: 5, name: "مانجو عويس", emoji: "🥭", price: 55, unit: "كيلو", cat: "فاكهة" },
      { id: 6, name: "فراولة طازة", emoji: "🍓", price: 35, unit: "علبة", cat: "فاكهة" },
      { id: 7, name: "موز بلدي", emoji: "🍌", price: 25, unit: "كيلو", cat: "فاكهة" },
      { id: 8, name: "برتقال عصير", emoji: "🍊", price: 20, unit: "كيلو", cat: "فاكهة" }
    ];

    let myCart = {};

    // دالة الدخول الصريحة
    function openHome() {
      document.getElementById("screen-splash").classList.remove("active");
      document.getElementById("screen-home").classList.add("active");
      document.getElementById("mainNavBar").style.display = "flex";
      renderProducts(allProducts);
      window.scrollTo(0, 0);
    }

    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(screenId).classList.add("active");
      window.scrollTo(0, 0);
    }

    function navTo(screenId, btn) {
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      showScreen(screenId);
      if (screenId === "screen-cart") updateCartUI();
    }

    function renderProducts(list) {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = list.map(p => `
        <div class="prod-card">
          <div class="prod-img">${p.emoji}</div>
          <div class="prod-name">${p.name}</div>
          <div class="prod-unit">${p.unit}</div>
          <div class="prod-price">${p.price} ج.م</div>
          <button type="button" class="btn-add" onclick="addToCart(${p.id})">＋ أضف للسلة</button>
        </div>
      `).join("");
    }

    function filterBy(category) {
      if (category === "الكل") renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.cat === category));
    }

    function searchProducts() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      renderProducts(allProducts.filter(p => p.name.includes(q)));
    }

    function addToCart(id) {
      myCart[id] = (myCart[id] || 0) + 1;
      updateBadge();
      alert("تمت الإضافة للسلة بنجاح!");
    }

    function updateBadge() {
      const totalCount = Object.values(myCart).reduce((a, b) => a + b, 0);
      document.getElementById("cartBadge").innerText = totalCount;
    }

    function changeQty(id, delta) {
      myCart[id] = (myCart[id] || 0) + delta;
      if (myCart[id] <= 0) delete myCart[id];
      updateCartUI();
      updateBadge();
    }

    function updateCartUI() {
      const listContainer = document.getElementById("cartItemsList");
      const entries = Object.entries(myCart);

      if (entries.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; padding:30px; color:#888;">السلة فارغة حالياً</p>';
        document.getElementById("cartTotal").innerText = "0 ج.م";
        return;
      }

      let grandTotal = 0;
      listContainer.innerHTML = entries.map(([id, qty]) => {
        const item = allProducts.find(p => p.id === Number(id));
        const sub = item.price * qty;
        grandTotal += sub;
        return `
          <div class="cart-item">
            <div>
              <b>${item.emoji} ${item.name}</b><br>
              <small>${item.price} ج.م × ${qty}</small>
            </div>
            <div>
              <button type="button" class="counter-btn" onclick="changeQty(${id}, -1)">-</button>
              <span style="margin: 0 8px; font-weight:bold;">${qty}</span>
              <button type="button" class="counter-btn" onclick="changeQty(${id}, 1)">+</button>
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("cartTotal").innerText = grandTotal + " ج.م";
    }

    function sendWhatsApp() {
      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const addr = document.getElementById("custAddress").value.trim();

      if (!name || !phone || !addr) {
        alert("برجاء إدخال الاسم، الهاتف، والعنوان!");
        return;
      }

      let summary = "";
      let total = 0;
      Object.entries(myCart).forEach(([id, qty]) => {
        const p = allProducts.find(item => item.id === Number(id));
        total += p.price * qty;
        summary += `• ${p.name} × ${qty} (${p.price * qty} ج.م)\n`;
      });

      const message = `🌿 *طلب جديد من تطبيق طازة*\n\n` +
        `👤 *الاسم:* ${name}\n` +
        `📞 *الهاتف:* ${phone}\n` +
        `📍 *العنوان:* ${addr}\n\n` +
        `🛒 *المنتجات:*\n${summary}\n` +
        `💰 *الإجمالي النهائي:* ${total} ج.م`;

      window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(message)}`, "_blank");
      myCart = {};
      updateBadge();
      navTo('screen-orders');
    }
  </script>
</body>
  </html>
