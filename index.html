<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طازة - خضار وفاكهة لحد باب بيتك</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="mobile-frame">

    <!-- 1. شاشة البداية (Splash / Welcome) -->
    <section id="screen-splash" class="screen active splash-screen">
      <div class="splash-content">
        <div class="brand-logo">🌿 طازة</div>
        <p class="brand-sub">خضار وفاكهة طازة .. لحد باب بيتك</p>
        <div class="splash-art">🧺🥬🍅🍊</div>
      </div>
      <div class="splash-actions">
        <button class="btn btn-primary" onclick="navigateTo('screen-home')">ابدأ الآن</button>
        <button class="btn-text" onclick="navigateTo('screen-home')">تخطي</button>
      </div>
    </section>

    <!-- 2. الصفحة الرئيسية -->
    <section id="screen-home" class="screen">
      <div class="top-bar">
        <div class="brand-title">🌿 طازة</div>
        <div class="location-badge">📍 القاهرة - مدينة نصر</div>
      </div>

      <div class="search-box">
        <input type="text" id="homeSearchInput" placeholder="بتدور على خضار أو فاكهة إيه؟" oninput="filterHomeProducts()">
      </div>

      <div class="promo-banner">
        <div>
          <h3>طازة كل يوم 🌱</h3>
          <p>من المزرعة مباشرة لأعلى جودة</p>
          <button onclick="navigateTo('screen-categories')">تسوق الآن</button>
        </div>
        <div class="banner-emoji">🥦🍎</div>
      </div>

      <div class="section-header">
        <h4>الأقسام</h4>
        <a href="#" onclick="navigateTo('screen-categories')">عرض الكل</a>
      </div>
      <div class="quick-categories">
        <div class="cat-pill" onclick="filterByCategory('الكل')">🌿 الكل</div>
        <div class="cat-pill" onclick="filterByCategory('خضار')">🥦 خضار</div>
        <div class="cat-pill" onclick="filterByCategory('فاكهة')">🍎 فاكهة</div>
        <div class="cat-pill" onclick="filterByCategory('عروض')">🏷️ عروض اليوم</div>
      </div>

      <div class="section-header">
        <h4>عروض ومنتجات طازة 🔥</h4>
      </div>
      <div class="products-grid" id="homeProductsGrid"></div>
    </section>

    <!-- 3. قائمة الأقسام -->
    <section id="screen-categories" class="screen">
      <div class="screen-header">
        <button class="back-btn" onclick="navigateTo('screen-home')">‹</button>
        <h3>الأقسام</h3>
        <span></span>
      </div>
      <div class="categories-list" id="categoriesListContainer"></div>
    </section>

    <!-- 4. تفاصيل المنتج -->
    <section id="screen-details" class="screen">
      <div class="screen-header transparent-header">
        <button class="back-btn" onclick="goBack()">‹</button>
        <button class="icon-btn" onclick="toggleDetailsFav()">♡</button>
      </div>
      <div class="details-image" id="detailsImg">🥭</div>
      <div class="details-card">
        <div class="details-title-row">
          <h2 id="details
